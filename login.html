<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 · 에브리펫</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head><body class="login-body">

  <div class="login-page">

    <!-- 오른쪽 로그인 폼 -->
    <div class="login-form-wrap">
      <div class="login-form-inner">

        <!-- 텍스트 자리 (직접 채워넣을 예정) -->
        <div class="login-top-text"></div>

        <!-- 사진 자리 (직접 채워넣을 예정) -->
        <div class="login-top-image"></div>

        <h1 class="login-title">LOGIN</h1>

        <form id="login-form" class="login-form">
          <input type="text" id="login-id" placeholder="아이디를 입력하세요" autocomplete="username">
          <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" autocomplete="current-password">

          <button type="submit" class="login-submit">로그인</button>
        </form>

        <div class="login-links">
          <a href="#">아이디 찾기</a>
          <span>|</span>
          <a href="#">비밀번호 찾기</a>
          <span>|</span>
          <a href="#">회원가입</a>
        </div>

        <div class="login-divider"><span>SNS 계정으로 로그인</span></div>

        <div class="login-social">
          <button type="button" class="social-btn social-kakao" aria-label="카카오로 로그인">
            <svg viewBox="0 0 24 24"><path d="M12 4C6.9 4 3 7.2 3 11.1c0 2.5 1.6 4.7 4 6.1-.2.7-.7 2.4-.8 2.8 0 0-.1.3.1.4.2.1.4 0 .4 0 .5-.1 3-2 3.5-2.3.6.1 1.2.1 1.8.1 5.1 0 9-3.2 9-7.1S17.1 4 12 4z" fill="#391B1B" /></svg>
          </button>
          <button type="button" class="social-btn social-naver" aria-label="네이버로 로그인">
            <svg viewBox="0 0 24 24"><path d="M14.5 4v7.6L9.7 4H4v16h5.5v-7.6l4.8 7.6H20V4h-5.5z" fill="#fff" /></svg>
          </button>
          <button type="button" class="social-btn social-google" aria-label="구글로 로그인">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z" />
              <path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.2-4 1.2-3.1 0-5.7-2.1-6.6-4.9H1.4v3.1C3.4 21.3 7.4 24 12 24z" />
              <path fill="#FBBC05" d="M5.4 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.6.4-2.4V6.5H1.4C.5 8.2 0 10 0 12s.5 3.8 1.4 5.5l4-3.1z" />
              <path fill="#EA4335" d="M12 4.8c1.7 0 3.3.6 4.5 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.4 0 3.4 2.7 1.4 6.5l4 3.1c.9-2.8 3.5-4.8 6.6-4.8z" />
            </svg>
          </button>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
